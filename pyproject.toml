[project]
name = "grax"
version = "0.1.0"
description = "GP regression using python and jax."
license = {file = "LICENSE"}
readme = "README.md"
authors = [{name = "Matthew W. Hoffman"}]
requires-python = ">=3.10"

dependencies = [
  "jax",
]

[dependency-groups]
dev = [
  "ipython",
  "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
